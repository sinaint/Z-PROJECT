<!-- 대시보드 화면을 그리는 HTML 파일이에요.
    이중 중괄호는 파이썬에서 넘겨준 값을 화면에 출력하는 문법이고,
    중괄호-퍼센트는 반복문(for), 조건문(if) 같은 로직을 쓰는 문법이에요. -->

<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI 보안 코파일럿 - 대시보드</title>
    <style>
        /* 아직 프론트엔드 프레임워크 없이, 기본 스타일만 살짝 입혔어요 */
        body {
            font-family: 'Malgun Gothic', sans-serif;
            background-color: #f5f5f5;
            padding: 40px;
        }
        h1 {
            color: #222;
        }
        .summary {
            display: flex;
            gap: 20px;
            margin-bottom: 30px;
        }
        .card {
            background: white;
            padding: 20px 30px;
            border-radius: 10px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.1);
        }
        .card.danger {
            border-left: 5px solid #e74c3c;
        }
        .card.safe {
            border-left: 5px solid #2ecc71;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            background: white;
            border-radius: 10px;
            overflow: hidden;
        }
        th, td {
            padding: 12px 16px;
            text-align: left;
            border-bottom: 1px solid #eee;
        }
        th {
            background-color: #333;
            color: white;
        }
        .status-danger {
            color: #e74c3c;
            font-weight: bold;
        }
        .status-safe {
            color: #2ecc71;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <h1>🛡️ S3 버킷 보안 스캔 결과</h1>

    <!-- 요약 카드 영역: 파이썬에서 넘겨준 total_count, public_count를 여기서 씀 -->
    <div class="summary">
        <div class="card">
            <div>전체 버킷 수</div>
            <h2>{{ total_count }}개</h2>
        </div>
        <div class="card danger">
            <div>공개된 버킷 수</div>
            <h2>{{ public_count }}개</h2>
        </div>
    </div>

    <!-- 결과 표 영역 -->
    <table>
        <thead>
            <tr>
                <th>버킷 이름</th>
                <th>상태</th>
            </tr>
        </thead>
        <tbody>
            <!-- results 리스트를 하나씩 꺼내면서 반복하는 부분이에요 -->
            {% for item in results %}
            <tr>
                <td>{{ item.name }}</td>
                <td>
                    <!-- is_public 값에 따라 다른 문구/스타일을 보여줘요 -->
                    {% if item.is_public %}
                        <span class="status-danger">🚨 공개됨</span>
                    {% else %}
                        <span class="status-safe">✅ 비공개</span>
                    {% endif %}
                </td>
            </tr>
            {% empty %}
            <!-- results가 비어있을 때(버킷이 하나도 없을 때) 보여줄 내용 -->
            <tr>
                <td colspan="2">아직 버킷이 없습니다.</td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
</body>
</html>
